<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Print Layout</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
    }

    body {
      width: 100%;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto;
      padding: 0;
      object-fit: contain;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    @media screen {
      body {
        max-width: 1100px;
        margin: 0 auto;
      }

      img {
        margin-bottom: 12px;
      }
    }

    @media print {
      @page {
        margin: 0;
      }

      html, body {
        width: 100%;
        margin: 0;
        padding: 0;
      }

      img {
        width: 100%;
        max-width: 100%;
        margin: 0;
        padding: 0;
        break-inside: avoid;
        page-break-inside: avoid;
      }
    }
  </style>
</head>
